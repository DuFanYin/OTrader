[project]
name = "otrader-backend"
version = "0.1.0"
description = "OTrader FastAPI backend (bridges the C++ engine via gRPC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "websockets>=12.0",
]

[tool.uv]
package = false
