[project]
name = "optra"
version = "0.0.0"
description = "Optra's server: the page's API, the live engine through gRPC, backtests, and the lab's tools"
requires-python = ">=3.13"
# Pinned to exact versions, each at least two weeks old when chosen.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "grpcio==1.82.1",
    "protobuf==7.35.1",
    "websockets==16.1",
    "httpx==0.28.1",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "numpy==2.5.4",
    "orjson==3.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Run from app/server: the optra package and the evals (tests/evals) import by name.
pythonpath = [".", "tests"]
testpaths = ["tests"]
# /tmp is a RAM disk on the ThinkPad: only the last run's folders of failed tests are kept.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
